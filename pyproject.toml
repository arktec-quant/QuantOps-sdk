[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantops-sdk"
version = "0.1.1"
description = "Protocol-first evidence-bundle SDK for QuantOps consumers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Arktec Quant"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Documentation = "https://github.com/arktec-quant/QuantOps-sdk"
Repository = "https://github.com/arktec-quant/QuantOps-sdk.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
